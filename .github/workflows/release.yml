name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # trusted publishing needs npm >= 11.5.1, which ships with Node 24
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/pk.js ./*.tgz
