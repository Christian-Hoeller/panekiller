# Fixed tmux look for the demo GIFs (tapes start the demo server with -f demo/tmux.conf).
set -g prefix C-b
set -g default-terminal "tmux-256color"
set -g status-style "bg=#262626,fg=#e0e0e0"
set -g status-left "#[fg=#1a1a1a,bg=#ff69b4,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#808080]pk demo "
set -g window-status-current-format "#[fg=#ff69b4,bold] #I:#W "
set -g window-status-format "#[fg=#808080] #I:#W "
set -g pane-border-style "fg=#3c3c3c"
set -g pane-active-border-style "fg=#ff69b4"
set -g escape-time 0
